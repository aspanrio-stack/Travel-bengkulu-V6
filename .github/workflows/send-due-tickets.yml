# Memicu pengiriman tiket terjadwal tiap 15 menit.
# Vercel Hobby hanya mengizinkan cron harian, jadi presisi 1–2 jam dipicu dari sini.
# Perlu GitHub Secret: CRON_SECRET (nilai sama dengan env CRON_SECRET di Vercel).
name: Kirim Tiket Terjadwal

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-due-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Panggil /api/cron/send-due-tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://bengkulutravel.com/api/cron/send-due-tickets
